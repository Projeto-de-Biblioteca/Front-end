<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6366f1" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
  <title>Minha Biblioteca</title>
</head>
<body>
  <div class="container py-4">

    <header class="mb-5">
      <div class="logo-box">
        <i data-lucide="book-open" class="title-icon"></i>
      </div>
      <h1>Minha Biblioteca</h1>
      <p class="subtitle">Gerencie seus livros e autores favoritos</p>
    </header>

    <section class="main-card mb-4">
      <div class="card-body">
        <h2 id="form-title" class="h4 mb-4">Novo Livro</h2>
        <form id="book-form">
          <input type="hidden" id="book-id" />

          <div class="mb-3">
            <label for="title" class="form-label">Título do Livro</label>
            <input type="text" id="title" class="form-control" required placeholder="Ex: O Senhor dos Anéis" />
          </div>

          <div class="mb-3">
            <label for="authorName" class="form-label">Autor</label>
            <input type="text" id="authorName" class="form-control" required placeholder="Nome do autor" />
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="genre" class="form-label">Gênero</label>
              <input type="text" id="genre" class="form-control" required placeholder="Ficção, Terror..." />
            </div>
            <div class="col-md-6 mb-3">
              <label for="pages" class="form-label">Páginas</label>
              <input type="number" id="pages" class="form-control" min="1" placeholder="Ex: 200" required />
            </div>
          </div>

          <div class="d-flex justify-content-center gap-2 mt-3">
            <button type="submit" class="btn btn-primary px-5">Salvar Livro</button>
            <button type="button" id="cancel-edit" class="btn btn-secondary d-none">Cancelar</button>
          </div>
        </form>
        <p id="message" class="mt-3 text-center"></p>
      </div>
    </section>

    <section class="main-card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="h4 m-0">Meus Livros</h2>
          <button id="refresh-books" class="btn btn-outline-custom btn-sm">
            <i data-lucide="refresh-cw" class="icon-sm"></i> Atualizar
          </button>
        </div>
        <div id="books-list" class="row"></div>
      </div>
    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
